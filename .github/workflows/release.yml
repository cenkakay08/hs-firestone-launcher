name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $latest = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            if ($latest -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3] + 1
              $tag = "v$major.$minor.$patch"
            } else {
              $tag = "v0.1.0"
            }
          }
          Write-Host "Release tag: $tag"
          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create project and copy source
        shell: pwsh
        run: |
          $proj = "HsFirestoneLauncher"
          if (-Not (Test-Path "$proj/$proj.csproj")) {
            dotnet new winforms -n $proj -o $proj -f net8.0 --force
          }
          Copy-Item -Force Program.cs "$proj/Program.cs"
          Copy-Item -Force LangData.cs "$proj/LangData.cs"
          # Patch the .csproj to ensure WinForms + correct namespace
          $csproj = "$proj/$proj.csproj"
          $xml = [xml](Get-Content $csproj)
          $pg = $xml.Project.PropertyGroup
          if ($pg -is [array]) { $pg = $pg[0] }
          $pg.TargetFramework = "net8.0-windows"
          if (-Not $pg.UseWindowsForms) {
            $el = $xml.CreateElement("UseWindowsForms")
            $el.InnerText = "true"
            $pg.AppendChild($el) | Out-Null
          }
          if (-Not $pg.RootNamespace) {
            $el = $xml.CreateElement("RootNamespace")
            $el.InnerText = "HsFirestoneLauncher"
            $pg.AppendChild($el) | Out-Null
          }
          $xml.Save((Resolve-Path $csproj))

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test HsFirestoneLauncher.Tests `
            --configuration Release `
            --logger "console;verbosity=normal"

      - name: Add NuGet packages
        shell: pwsh
        run: |
          Set-Location HsFirestoneLauncher
          dotnet add package System.Management --version 7.0.0

      - name: Build the executable
        shell: pwsh
        run: |
          Set-Location HsFirestoneLauncher
          dotnet publish -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ../out

      # ── Code Signing via SSL.com eSigner (runs only when secrets are configured) ─
      - name: Check signing credentials
        id: check-sign
        shell: pwsh
        env:
          SSLCOM_USERNAME: ${{ secrets.SSLCOM_USERNAME }}
        run: |
          $has = -not [string]::IsNullOrWhiteSpace($env:SSLCOM_USERNAME)
          "enabled=$has" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign executable with SSL.com eSigner
        if: steps.check-sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSLCOM_USERNAME }}
          password: ${{ secrets.SSLCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLCOM_TOTP_SECRET }}
          file_path: out/HsFirestoneLauncher.exe
          malware_block: false
          environment_name: PROD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: out/HsFirestoneLauncher.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.tag_name }}
          generate_release_notes: true
          files: HsFirestoneLauncher.exe
