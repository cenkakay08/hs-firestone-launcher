name: Build & Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $latest = git tag --sort=-v:refname | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Select-Object -First 1
            if ($latest -match '^v(\d+)\.(\d+)\.(\d+)$') {
              $major = [int]$Matches[1]
              $minor = [int]$Matches[2]
              $patch = [int]$Matches[3] + 1
              $tag = "v$major.$minor.$patch"
            } else {
              $tag = "v0.1.0"
            }
          }
          Write-Host "Release tag: $tag"
          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test HsFirestoneLauncher.Tests `
            --configuration Release `
            --logger "console;verbosity=normal"

      - name: Build the executable
        run: dotnet publish HsFirestoneLauncher/HsFirestoneLauncher.csproj --configuration Release --runtime win-x64 --output out

      # ── Code Signing via SSL.com eSigner (runs only when secrets are configured) ─
      - name: Check signing credentials
        id: check-sign
        shell: pwsh
        env:
          SSLCOM_USERNAME: ${{ secrets.SSLCOM_USERNAME }}
        run: |
          $has = -not [string]::IsNullOrWhiteSpace($env:SSLCOM_USERNAME)
          "enabled=$has" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Sign executable with SSL.com eSigner
        if: steps.check-sign.outputs.enabled == 'true'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSLCOM_USERNAME }}
          password: ${{ secrets.SSLCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLCOM_TOTP_SECRET }}
          file_path: out/HsFirestoneLauncher.exe
          malware_block: false
          environment_name: PROD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: out/HsFirestoneLauncher.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag_name }}
          name: ${{ needs.build.outputs.tag_name }}
          generate_release_notes: true
          files: HsFirestoneLauncher.exe
