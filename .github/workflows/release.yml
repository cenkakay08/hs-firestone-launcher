name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create project and copy source
        shell: pwsh
        run: |
          $proj = "HsFirestoneLauncher"
          if (-Not (Test-Path "$proj/$proj.csproj")) {
            dotnet new winforms -n $proj -o $proj -f net8.0 --force
          }
          Copy-Item -Force Program.cs "$proj/Program.cs"
          Copy-Item -Force LangData.cs "$proj/LangData.cs"
          # Patch the .csproj to ensure WinForms + correct namespace
          $csproj = "$proj/$proj.csproj"
          $xml = [xml](Get-Content $csproj)
          $pg = $xml.Project.PropertyGroup
          if ($pg -is [array]) { $pg = $pg[0] }
          $pg.TargetFramework = "net8.0-windows"
          if (-Not $pg.UseWindowsForms) {
            $el = $xml.CreateElement("UseWindowsForms")
            $el.InnerText = "true"
            $pg.AppendChild($el) | Out-Null
          }
          if (-Not $pg.RootNamespace) {
            $el = $xml.CreateElement("RootNamespace")
            $el.InnerText = "HsFirestoneLauncher"
            $pg.AppendChild($el) | Out-Null
          }
          $xml.Save((Resolve-Path $csproj))

      - name: Run unit tests
        shell: pwsh
        run: |
          dotnet test HsFirestoneLauncher.Tests `
            --configuration Release `
            --logger "console;verbosity=normal"

      - name: Add NuGet packages
        shell: pwsh
        run: |
          Set-Location HsFirestoneLauncher
          dotnet add package System.Management --version 7.0.0

      - name: Build the executable
        shell: pwsh
        run: |
          Set-Location HsFirestoneLauncher
          dotnet publish -c Release -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ../out

      # ── Code Signing via SSL.com eSigner ────────────────────────────────────
      # Requires these GitHub Secrets to be set in repo settings:
      #   SSLCOM_USERNAME   → your SSL.com account e-mail
      #   SSLCOM_PASSWORD   → your SSL.com account password
      #   SSLCOM_TOTP_SECRET → TOTP secret from SSL.com 2FA setup
      #   SSLCOM_CREDENTIAL_ID → Certificate credential ID from SSL.com dashboard
      - name: Sign executable with SSL.com eSigner
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.SSLCOM_USERNAME }}
          password: ${{ secrets.SSLCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLCOM_TOTP_SECRET }}
          file_path: out/HsFirestoneLauncher.exe
          malware_block: false
          environment_name: PROD

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: out/HsFirestoneLauncher.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: HsFirestoneLauncher.exe
