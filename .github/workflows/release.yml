name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure .csproj exists
        run: |
            if (-Not (Test-Path "HsFirestoneLauncher/HsFirestoneLauncher.csproj")) {
              dotnet new console -n HsFirestoneLauncher -o HsFirestoneLauncher -f net8.0 --force
            }
            Copy-Item -Force Program.cs HsFirestoneLauncher/Program.cs
      - name: Add System.Management reference
        run: dotnet add package System.Management --version 7.0.0
      - name: Build the executable
        run: |
          dotnet publish -c Release -r win-x64 \
            --self-contained false \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o out
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: out/HsFirestoneLauncher.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: launcher
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: HsFirestoneLauncher.exe
