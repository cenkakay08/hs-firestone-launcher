name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test HsFirestoneLauncher.Tests --configuration Release --logger "console;verbosity=normal"

  build:
    name: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish release executable
        run: dotnet publish HsFirestoneLauncher/HsFirestoneLauncher.csproj --configuration Release --runtime win-x64 --output out

  auto-approve:
    name: auto-approve
    needs: [test, build]
    if: success() && github.event.pull_request.user.login == 'cenkakay08'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Auto-approve and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          gh pr review "$PR_URL" --approve --body "Auto-approved: unit tests and release build passed, and author is @cenkakay08."
          if [ "$HEAD_REF" != "dev" ] && [ "$HEAD_REF" != "main" ]; then
            gh pr merge "$PR_URL" --merge --delete-branch
          else
            gh pr merge "$PR_URL" --merge
          fi
          if [ "$BASE_REF" = "main" ]; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
