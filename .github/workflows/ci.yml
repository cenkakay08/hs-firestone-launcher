name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test HsFirestoneLauncher.Tests --configuration Release --logger "console;verbosity=normal"

  auto-approve:
    name: auto-approve
    needs: test
    if: success() && github.event.pull_request.user.login == 'cenkakay08'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review "$PR_URL" --approve --body "Auto-approved: unit tests passed and author is @cenkakay08."
